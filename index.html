<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>校内マップ</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      touch-action: none;
    }
    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    #viewport.dragging { cursor: grabbing; }
    #map {
      position: absolute;
      left: 0;
      top: 0;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      transform-origin: 0 0;
      will-change: transform;
      pointer-events: none;
    }
    #controls {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    button {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      color: #222;
      font-size: 24px;
      line-height: 1;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      cursor: pointer;
    }
    button:active { transform: scale(.94); }
    #reset { font-size: 18px; }
    @media (max-width: 600px) {
      #controls { right: 12px; bottom: 12px; }
      button { width: 42px; height: 42px; }
    }
  </style>
</head>
<body>
  <div id="viewport">
    <img id="map" src="map.png" alt="校内マップ">
  </div>

  <div id="controls" aria-label="マップ操作">
    <button id="zoomOut" aria-label="縮小">−</button>
    <button id="reset" aria-label="全体表示">⛶</button>
    <button id="zoomIn" aria-label="拡大">＋</button>
  </div>

  <script>
    const viewport = document.getElementById('viewport');
    const map = document.getElementById('map');

    let scale = 1, x = 0, y = 0;
    let startX = 0, startY = 0, startScale = 1;
    let dragging = false;
    let lastX = 0, lastY = 0;
    let pinchStartDist = 0, pinchStartScale = 1;
    let pinchCenter = {x: 0, y: 0};

    const MIN_SCALE = 0.1;
    const MAX_SCALE = 8;

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function render() {
      map.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
    }

    function fitToScreen() {
      if (!map.naturalWidth || !map.naturalHeight) return;
      const vw = viewport.clientWidth;
      const vh = viewport.clientHeight;
      scale = Math.min(vw / map.naturalWidth, vh / map.naturalHeight);
      x = (vw - map.naturalWidth * scale) / 2;
      y = (vh - map.naturalHeight * scale) / 2;
      render();
    }

    function zoomAt(factor, cx, cy) {
      const oldScale = scale;
      const newScale = clamp(scale * factor, MIN_SCALE, MAX_SCALE);
      if (newScale === oldScale) return;

      // Keep the point under the cursor/finger stationary.
      x = cx - (cx - x) * (newScale / oldScale);
      y = cy - (cy - y) * (newScale / oldScale);
      scale = newScale;
      render();
    }

    function distance(a, b) {
      return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    }

    function center(a, b) {
      return {
        x: (a.clientX + b.clientX) / 2,
        y: (a.clientY + b.clientY) / 2
      };
    }

    map.addEventListener('load', fitToScreen);
    window.addEventListener('resize', fitToScreen);

    viewport.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, cx, cy);
    }, {passive:false});

    viewport.addEventListener('pointerdown', e => {
      viewport.setPointerCapture(e.pointerId);
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      viewport.classList.add('dragging');
    });

    viewport.addEventListener('pointermove', e => {
      if (!dragging) return;
      x += e.clientX - lastX;
      y += e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      render();
    });

    viewport.addEventListener('pointerup', e => {
      dragging = false;
      viewport.classList.remove('dragging');
      try { viewport.releasePointerCapture(e.pointerId); } catch (_) {}
    });

    viewport.addEventListener('pointercancel', () => {
      dragging = false;
      viewport.classList.remove('dragging');
    });

    // Touch pinch zoom.
    let touches = new Map();

    viewport.addEventListener('touchstart', e => {
      for (const t of e.changedTouches) touches.set(t.identifier, t);
      if (touches.size === 2) {
        const pts = [...touches.values()];
        pinchStartDist = distance(pts[0], pts[1]);
        pinchStartScale = scale;
        pinchCenter = center(pts[0], pts[1]);
        startX = x;
        startY = y;
      }
    }, {passive:false});

    viewport.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) touches.set(t.identifier, t);
      if (touches.size !== 2 || !pinchStartDist) return;

      const pts = [...touches.values()];
      const currentDist = distance(pts[0], pts[1]);
      const newScale = clamp(pinchStartScale * currentDist / pinchStartDist, MIN_SCALE, MAX_SCALE);

      const ratio = newScale / pinchStartScale;
      x = pinchCenter.x - (pinchCenter.x - startX) * ratio;
      y = pinchCenter.y - (pinchCenter.y - startY) * ratio;
      scale = newScale;
      render();
    }, {passive:false});

    viewport.addEventListener('touchend', e => {
      for (const t of e.changedTouches) touches.delete(t.identifier);
      if (touches.size < 2) pinchStartDist = 0;
    });

    document.getElementById('zoomIn').addEventListener('click', () => {
      zoomAt(1.25, viewport.clientWidth / 2, viewport.clientHeight / 2);
    });
    document.getElementById('zoomOut').addEventListener('click', () => {
      zoomAt(1 / 1.25, viewport.clientWidth / 2, viewport.clientHeight / 2);
    });
    document.getElementById('reset').addEventListener('click', fitToScreen);

    // Double click/tap to zoom.
    viewport.addEventListener('dblclick', e => {
      zoomAt(2, e.clientX, e.clientY);
    });
  </script>
</body>
</html>
